server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Single-page app: unknown paths (e.g. /category/jewelery) fall back to index.html
  # so React Router can handle them on a page refresh or a shared link.
  location / {
    # index.html must be re-checked on every visit so a new deploy is picked up
    # (it points at the new hashed asset files).
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # Built asset filenames contain a content hash, so they can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
